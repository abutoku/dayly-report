name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push Docker image
        run: |
          gcloud builds submit \
            --tag asia-northeast1-docker.pkg.dev/zippy-facility-492308-f2/dayly-report/app:${{ github.sha }} \
            --project zippy-facility-492308-f2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy dayly-report \
            --image asia-northeast1-docker.pkg.dev/zippy-facility-492308-f2/dayly-report/app:${{ github.sha }} \
            --region asia-northeast1 \
            --project zippy-facility-492308-f2 \
            --platform managed \
            --allow-unauthenticated
