services:
  postgres:
    image: postgres:16-alpine
    container_name: dayly-report-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dayly_report
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dayly_report"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
